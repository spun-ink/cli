# A `v*` tag publishes a GitHub release: six archives, checksums.txt and an SPDX SBOM per archive.
# `goreleaser release --snapshot --clean` builds the same locally (it needs syft on PATH).
version: 2

project_name: spun

builds:
  - main: ./cmd/spun
    binary: spun
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.buildSource={{ if .IsSnapshot }}snapshot{{ else }}release{{ end }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, SECURITY.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

release:
  github:
    owner: spun-ink
    name: cli
  prerelease: auto
  name_template: "spun v{{ .Version }}"
  header: |
    ### Install

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/spun-ink/cli/main/scripts/install.sh | sh
    ```

    **Windows (PowerShell):**
    ```powershell
    irm https://raw.githubusercontent.com/spun-ink/cli/main/scripts/install.ps1 | iex
    ```

    Or download an archive below and check it against `checksums.txt`. The macOS binary is not
    notarized: an archive downloaded with a browser needs `xattr -d com.apple.quarantine spun` once;
    the install scripts do not.

    Then `spun signup` opens the sign-up page for a new account, and `spun login` stores your
    token. Later, `spun upgrade` updates an installed release in place.

    **Sign-up moved to the browser.** `spun signup` no longer creates an account from the shell.
    v0.4 and v0.5 fail at their next `spun signup`, or when continuing a pending one: upgrade with
    `spun upgrade` or the install script, or sign up at https://spun.ink/signup and run
    `spun login`. Commands with a stored token keep working.

changelog:
  use: github-native
