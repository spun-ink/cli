name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Installs the release just published the way a user would, on every platform.
  smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          SPUN_VERSION: ${{ github.ref_name }}
          SPUN_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh scripts/install.sh
          "$SPUN_INSTALL_DIR/spun" --version | tee version.txt
          grep -F "${GITHUB_REF_NAME#v}" version.txt
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SPUN_VERSION: ${{ github.ref_name }}
          SPUN_INSTALL_DIR: ${{ runner.temp }}\bin
        run: |
          ./scripts/install.ps1
          $out = & "$env:SPUN_INSTALL_DIR\spun.exe" --version
          $out
          if (-not ($out -match [regex]::Escape($env:GITHUB_REF_NAME.TrimStart('v')))) { exit 1 }
