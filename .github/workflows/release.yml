name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upgrade_from: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      # The release the smoke job upgrades from: the newest earlier non-prerelease tag in this tag's
      # history, if it has `spun upgrade` (v0.2.0 on).
      - id: previous
        run: |
          previous=$(git tag --list 'v*' --merged HEAD --sort=-v:refname | grep -v -- - | grep -vFx "$GITHUB_REF_NAME" | head -n 1 || true)
          if [ -n "$previous" ] && [ "$(printf '%s\n' v0.2.0 "$previous" | sort -V | head -n 1)" != v0.2.0 ]; then
            previous=
          fi
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
          echo "upgrade leg from: ${previous:-none}"
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Installs the release just published the way a user would, on every platform.
  smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          SPUN_VERSION: ${{ github.ref_name }}
          SPUN_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh scripts/install.sh
          "$SPUN_INSTALL_DIR/spun" --version | tee version.txt
          grep -Fx "spun version ${GITHUB_REF_NAME#v} (release)" version.txt
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SPUN_VERSION: ${{ github.ref_name }}
          SPUN_INSTALL_DIR: ${{ runner.temp }}\bin
        run: |
          ./scripts/install.ps1
          $out = & "$env:SPUN_INSTALL_DIR\spun.exe" --version
          $out
          if ($out -ne "spun version $($env:GITHUB_REF_NAME.TrimStart('v')) (release)") { exit 1 }
      # Upgrades the previous release to this one, the way most users will get it. The target is
      # named, never "latest": a bare `spun upgrade` skips prereleases and races later tags.
      - name: spun upgrade
        if: needs.publish.outputs.upgrade_from != '' && runner.os != 'Windows'
        env:
          SPUN_VERSION: ${{ needs.publish.outputs.upgrade_from }}
        run: |
          export SPUN_INSTALL_DIR="$HOME/.local/spun-upgrade"
          sh scripts/install.sh
          "$SPUN_INSTALL_DIR/spun" upgrade "$GITHUB_REF_NAME"
          "$SPUN_INSTALL_DIR/spun" --version | tee version.txt
          grep -Fx "spun version ${GITHUB_REF_NAME#v} (release)" version.txt
      - name: spun upgrade
        if: needs.publish.outputs.upgrade_from != '' && runner.os == 'Windows'
        shell: pwsh
        env:
          SPUN_VERSION: ${{ needs.publish.outputs.upgrade_from }}
        run: |
          $env:SPUN_INSTALL_DIR = Join-Path $env:LOCALAPPDATA 'Programs\spun-upgrade'
          ./scripts/install.ps1
          $exe = Join-Path $env:SPUN_INSTALL_DIR 'spun.exe'
          $result = & $exe upgrade $env:GITHUB_REF_NAME 2>&1
          $result
          # Hosted Windows runners run elevated, which spun upgrade refuses by design.
          if ($LASTEXITCODE -eq 5 -and "$result" -match 'administrator') {
            Write-Output '::warning::runner is elevated; spun upgrade refused as designed'
            exit 0
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = & $exe --version
          $out
          if ($out -ne "spun version $($env:GITHUB_REF_NAME.TrimStart('v')) (release)") { exit 1 }
